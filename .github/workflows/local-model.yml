name: Credential-free model evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-model-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Start isolated Ollama server
        run: |
          docker run -d --rm --name opsproof-ollama -p 127.0.0.1:11434:11434 ollama/ollama
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs opsproof-ollama
          exit 1
      - name: Pull credential-free instruction model
        run: |
          docker exec opsproof-ollama ollama pull qwen2.5:3b
          docker exec opsproof-ollama ollama list | tee ollama-model.txt
          docker exec opsproof-ollama ollama --version | tee -a ollama-model.txt
      - name: Run three repeated trials per incident
        run: python -m opsproof benchmark --agent ollama --model qwen2.5:3b --repeats 3 --out reports/generated/ollama-benchmark.json
      - name: Verify trial record and print actual model results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('reports/generated/ollama-benchmark.json').read_text())
          assert data['agent_type'] == 'ollama'
          assert data['model'] == 'qwen2.5:3b'
          assert len(data['trials']) == 36
          guarded = data['summary']['guarded-agent']
          assert guarded['trials'] == 12
          print(json.dumps(data['summary'], indent=2))
          PY
      - name: Preserve model identity and full trials
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-model-evidence
          path: |
            ollama-model.txt
            reports/generated/ollama-benchmark.json
          if-no-files-found: warn
