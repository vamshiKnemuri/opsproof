[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsproof"
version = "0.1.0"
description = "An agentic DevOps flight simulator with deterministic safety gates"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
opsproof = "opsproof.cli:main"

[tool.setuptools.packages.find]
include = ["opsproof*"]
